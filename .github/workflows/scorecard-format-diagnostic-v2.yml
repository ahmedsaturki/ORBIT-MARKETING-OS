name: ORBIT Scorecard Formatter Diagnostic v2

on:
  push:
    branches:
      - docs/reconcile-main-evidence-2026-09-28

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Compare Prettier output
        run: |
          pnpm exec prettier docs/RELEASE_SCORECARD.md > /tmp/scorecard.prettier.md
          if cmp -s docs/RELEASE_SCORECARD.md /tmp/scorecard.prettier.md; then
            echo "FORMAT_MATCH=true"
          else
            echo "FORMAT_MATCH=false"
            diff -u docs/RELEASE_SCORECARD.md /tmp/scorecard.prettier.md || true
            echo "CURRENT_TAIL"
            tail -c 80 docs/RELEASE_SCORECARD.md | od -An -tx1 -c
            echo "FORMATTED_TAIL"
            tail -c 80 /tmp/scorecard.prettier.md | od -An -tx1 -c
          fi
