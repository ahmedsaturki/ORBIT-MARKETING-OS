name: Vercel Production Provenance

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-vercel-provenance
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public production provenance
        env:
          ORBIT_LIVE_URL: https://orbit-marketing-os.vercel.app
          ORBIT_EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify-public-vercel-provenance.mjs
