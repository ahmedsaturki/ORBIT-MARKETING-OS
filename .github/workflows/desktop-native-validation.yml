name: Desktop Native Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/desktop/**"
      - "packages/core/**"
      - "packages/shared-ui/**"
      - "scripts/build-tauri.mjs"
      - "scripts/build-icon.mjs"
      - "e2e/tauri-shell.spec.ts"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-desktop-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Require committed lockfiles
        shell: bash
        run: |
          test -s pnpm-lock.yaml
          test -s packages/desktop/src-tauri/Cargo.lock
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Generate app icons
        run: pnpm --dir packages/desktop tauri icon src-tauri/icon-source.svg
      - name: Build desktop
        run: pnpm --dir packages/desktop tauri build
      - name: Upload desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-desktop-${{ matrix.artifact }}
          path: packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  windows-e2e:
    name: Windows native E2E
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Require committed lockfiles
        shell: pwsh
        run: |
          if (!(Test-Path pnpm-lock.yaml)) { exit 1 }
          if (!(Test-Path packages/desktop/src-tauri/Cargo.lock)) { exit 1 }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate app icons
        run: pnpm --dir packages/desktop tauri icon src-tauri/icon-source.svg
      - name: Build desktop
        run: pnpm --dir packages/desktop tauri build --features e2e-cdp
      - name: Build web surface for native E2E server
        run: pnpm --dir packages/web build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Run native and web E2E
        run: pnpm test:e2e
