name: One-off format repair

on:
  push:
    branches:
      - fix/release-readiness-verifier-contract-20260927

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/verify-release-readiness.mjs scripts/verify-release-readiness.test.mjs .github/workflows/ci.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- scripts/verify-release-readiness.mjs scripts/verify-release-readiness.test.mjs .github/workflows/ci.yml; then
            exit 0
          fi
          git add scripts/verify-release-readiness.mjs scripts/verify-release-readiness.test.mjs .github/workflows/ci.yml
          git commit -m "style(release): apply project prettier to verifier"
          git push
