name: Bootstrap reproducible lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: (github.ref_name == 'rebuild/orbit-production' || github.ref_name == 'rebuild/orbit-production-consolidated' || github.ref_name == 'rebuild/orbit-production-final') && github.actor == 'ahmedsaturki'
    runs-on: [self-hosted, x64, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Runner preflight
        run: bash scripts/self-hosted-preflight.sh

      - name: Generate JavaScript lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Generate Rust lockfile
        working-directory: packages/desktop/src-tauri
        run: cargo generate-lockfile

      - name: Verify reproducible lockfiles
        run: node -e "const fs=require('node:fs'); for (const p of ['pnpm-lock.yaml','packages/desktop/src-tauri/Cargo.lock']) { const s=fs.statSync(p); if(!s.isFile() || s.size===0) process.exit(1); }"

      - name: Commit lockfiles to selected production rebuild branch
        run: node scripts/commit-lockfiles.mjs
