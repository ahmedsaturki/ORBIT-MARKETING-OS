name: ORBIT PR67 normalization
on:
  push:
    branches:
      - feat/orbit-unified-search-research-20260926

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix Rust search fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/desktop/src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          marker = "fn global_search_is_workspace_scoped_and_bounded"
          fn_start = text.find(marker)
          if fn_start == -1:
              raise SystemExit("search fixture function not found")
          next_test = text.find("\n    #[test]", fn_start + len(marker))
          if next_test == -1:
              raise SystemExit("next test boundary not found")
          block = text[fn_start:next_test]

          opening = '                "INSERT INTO workspaces(id, name, created_at)'
          closing = '                 VALUES (\'source-1\', \'workspace-1\', \'url\', \'Source\', \'https://example.com\', \'1\');",'
          if opening in block and 'r#"INSERT INTO workspaces' not in block:
              block = block.replace(opening, '                r#"INSERT INTO workspaces(id, name, created_at)', 1)
              block = block.replace(closing, '                 VALUES (\'source-1\', \'workspace-1\', \'url\', \'Source\', \'https://example.com\', \'1\');"#,', 1)
          text = text[:fn_start] + block + text[next_test:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Rust format
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --all

      - name: Prettier changed surfaces
        run: pnpm exec prettier --write           docs/ACCEPTANCE_MATRIX_V2.md           docs/API.md           docs/LAUNCH_SCORECARD.md           docs/PRODUCT_SURFACE_MATRIX.md           e2e/tauri-shell.spec.ts           packages/desktop/src/App.tsx

      - name: Commit normalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_normalize-orbit-pr67.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git commit -m "fix: normalize search branch formatting and fixture"
          git push
