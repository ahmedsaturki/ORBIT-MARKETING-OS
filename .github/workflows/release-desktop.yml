name: Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Require committed lockfiles
        run: test -f pnpm-lock.yaml
      - name: Require desktop Cargo.lock
        run: test -f packages/desktop/src-tauri/Cargo.lock
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Secret scan
        run: pnpm security:scan
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Desktop IPC contract
        run: pnpm verify:ipc
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Release sanity
        run: pnpm verify:release
      - name: Release readiness contract
        run: pnpm verify:readiness -- --mode verification

      - name: Core coverage
        run: pnpm --filter @orbit/core test:coverage

      - name: Runtime smoke
        run: pnpm test:runtime

      - name: Performance smoke
        run: pnpm test:performance

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
      - name: Format check
        run: pnpm format:check

  build:
    name: Build ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main release line
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit] verified stable action commit
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify:workspace

      - name: Generate app icons
        run: pnpm --dir packages/desktop tauri icon src-tauri/icon-source.svg

      - name: Build desktop
        run: pnpm --dir packages/desktop tauri build

      - name: Generate desktop SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          path: packages/desktop/src-tauri/target/release/bundle
          format: cyclonedx-json
          output-file: release-sbom/orbit-desktop-${{ matrix.artifact }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload desktop SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-desktop-sbom-${{ matrix.artifact }}
          path: release-sbom/orbit-desktop-${{ matrix.artifact }}.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate desktop provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/desktop/src-tauri/target/release/bundle/**/*

      - name: Generate desktop SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/desktop/src-tauri/target/release/bundle/**/*
          sbom-path: release-sbom/orbit-desktop-${{ matrix.artifact }}.cdx.json

      - name: Upload desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-desktop-${{ matrix.artifact }}
          path: packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: orbit-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Build release manifest
        shell: bash
        run: |
          cat > release-assets/RELEASE-MANIFEST.txt <<EOF
          product=ORBIT Marketing OS
          version=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          source=verified-main-lineage
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          signing=unsigned
          EOF

      - name: Build checksums
        shell: bash
        run: |
          find release-assets -type f -not -name 'SHA256SUMS.txt' -print0             | sort -z             | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f ! -name 'SHA256SUMS.txt' -print0)
          test "${#ASSETS[@]}" -gt 0
          gh release create "$RELEASE_TAG"             --title "ORBIT Marketing OS $RELEASE_TAG — validation build"             --prerelease --generate-notes             release-assets/SHA256SUMS.txt             "${ASSETS[@]}"
