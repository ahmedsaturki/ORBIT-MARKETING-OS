name: Temporary Prettier Formatting Helper

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docs/RELEASE_SCORECARD.md"
      - "docs/DISTRIBUTION.md"
      - "docs/VERIFICATION_BLOCKERS.md"
      - "docs/RELEASE_READINESS.md"
      - ".github/workflows/temporary-prettier-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format release docs
        run: pnpm exec prettier --write docs/RELEASE_SCORECARD.md docs/DISTRIBUTION.md docs/VERIFICATION_BLOCKERS.md docs/RELEASE_READINESS.md
      - name: Upload formatted docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-prettier-release-docs-${{ github.run_id }}
          path: |
            docs/RELEASE_SCORECARD.md
            docs/DISTRIBUTION.md
            docs/VERIFICATION_BLOCKERS.md
            docs/RELEASE_READINESS.md
          if-no-files-found: error
          retention-days: 3
