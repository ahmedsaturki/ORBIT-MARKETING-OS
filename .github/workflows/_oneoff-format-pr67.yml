name: ORBIT PR67 one-off format
on:
  push:
    branches:
      - feat/orbit-unified-search-research-20260926
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write e2e/tauri-shell.spec.ts packages/core/src/search/index.test.ts packages/desktop/src/App.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tauri-shell.spec.ts packages/core/src/search/index.test.ts packages/desktop/src/App.tsx
          git rm .github/workflows/_oneoff-format-pr67.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize PR67 formatting"
          git push
