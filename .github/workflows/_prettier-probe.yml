name: Temporary Prettier Probe

on:
  push:
    branches:
      - docs/reconcile-production-provenance-20260928

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format release scorecard
        run: pnpm exec prettier docs/RELEASE_SCORECARD.md > /tmp/RELEASE_SCORECARD.md
      - name: Show exact diff
        run: diff -u docs/RELEASE_SCORECARD.md /tmp/RELEASE_SCORECARD.md || true
      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: prettier-probe-release-scorecard
          path: /tmp/RELEASE_SCORECARD.md
