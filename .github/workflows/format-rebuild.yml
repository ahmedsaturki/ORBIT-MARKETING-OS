name: Format Rebuild Branch

on:
  push:
    branches: ["rebuild/orbit-production-final", "feat/orbit-command-dispatcher-main-20260926"]

permissions:
  contents: write

concurrency:
  group: orbit-format-rebuild
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Require committed lockfile
        run: test -s pnpm-lock.yaml

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Format Rust sources
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --all

      - name: Format repository
        run: pnpm exec prettier --write .

      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "style: normalize repository formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
