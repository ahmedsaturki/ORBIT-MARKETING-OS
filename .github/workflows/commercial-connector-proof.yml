name: ORBIT Live Connector Proof

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type LIVE_PROOF to authorize real Telegram + LinkedIn test delivery"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orbit-live-connector-proof
  cancel-in-progress: false

jobs:
  proof:
    if: github.actor == 'ahmedsaturki' && inputs.confirm == 'LIVE_PROOF'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Run owner-authorized live proof
        env:
          ORBIT_TELEGRAM_TEST_TOKEN: ${{ secrets.ORBIT_TELEGRAM_TEST_TOKEN }}
          ORBIT_TELEGRAM_TEST_CHAT_ID: ${{ secrets.ORBIT_TELEGRAM_TEST_CHAT_ID }}
          ORBIT_LINKEDIN_TEST_TOKEN: ${{ secrets.ORBIT_LINKEDIN_TEST_TOKEN }}
          ORBIT_LINKEDIN_TEST_AUTHOR_URN: ${{ secrets.ORBIT_LINKEDIN_TEST_AUTHOR_URN }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/commercial-connector-proof.ts --confirm-live --output .artifacts/commercial-connector-proof.json

      - name: Upload proof artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-live-connector-proof-${{ github.run_id }}
          path: .artifacts/commercial-connector-proof.json
          retention-days: 90
