name: ORBIT Format Debug

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-debug:
    if: startsWith(github.head_ref, 'feat/experimentation-learning-20260926')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and print exact diff
        run: |
          pnpm exec prettier --write docs/ACCEPTANCE_MATRIX_V2.md packages/core/src/experiments/index.ts
          git diff --no-ext-diff --unified=3 -- docs/ACCEPTANCE_MATRIX_V2.md packages/core/src/experiments/index.ts
