name: Vercel Production Provenance

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-vercel-provenance
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify public production provenance
        env:
          ORBIT_LIVE_URL: https://orbit-marketing-os.vercel.app
          ORBIT_EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify-public-vercel-provenance.mjs
