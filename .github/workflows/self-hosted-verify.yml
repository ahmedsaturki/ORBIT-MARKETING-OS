name: Self-Hosted Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-self-hosted-verification
  cancel-in-progress: true

jobs:
  verify:
    if: (github.ref_name == 'rebuild/orbit-production' || github.ref_name == 'rebuild/orbit-production-consolidated' || github.ref_name == 'rebuild/orbit-production-final') && github.actor == 'ahmedsaturki'
    name: Full verification on owned runner
    runs-on: [self-hosted, x64, linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Runner preflight
        run: bash scripts/self-hosted-preflight.sh

      - name: Verify host toolchain
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Require committed lockfiles
        run: node -e "const fs=require('node:fs'); for (const p of ['pnpm-lock.yaml','packages/desktop/src-tauri/Cargo.lock']) { const s=fs.statSync(p); if(!s.isFile() || s.size===0) process.exit(1); }"

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Release sanity
        run: pnpm verify:release

      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Secret scan
        run: pnpm security:scan

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Desktop IPC contract
        run: pnpm verify:ipc

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Core coverage
        run: pnpm --filter @orbit/core test:coverage

      - name: Runtime smoke
        run: pnpm test:runtime

      - name: Performance smoke
        run: pnpm test:performance

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium on Linux
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright Chromium on Windows/macOS
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Format check
        run: pnpm format:check

      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust format/check/test/clippy
        working-directory: packages/desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
