name: Temporary Prettier Formatting Helper

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docs/RELEASE_SCORECARD.md"
      - "docs/DISTRIBUTION.md"
      - "docs/VERIFICATION_BLOCKERS.md"
      - "docs/RELEASE_READINESS.md"
      - ".github/workflows/temporary-prettier-helper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ github.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format release docs
        run: pnpm exec prettier --write docs/RELEASE_SCORECARD.md docs/DISTRIBUTION.md docs/VERIFICATION_BLOCKERS.md docs/RELEASE_READINESS.md
      - name: Commit formatted docs and remove helper
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE_SCORECARD.md docs/DISTRIBUTION.md docs/VERIFICATION_BLOCKERS.md docs/RELEASE_READINESS.md
          git rm .github/workflows/temporary-prettier-helper.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore(ci): apply Prettier formatting to release docs"
          git push origin "HEAD:${TARGET_BRANCH}"
