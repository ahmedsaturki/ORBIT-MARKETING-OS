name: Normalize Rust formatting

on:
  push:
    branches: ["rebuild/orbit-production-consolidated"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-rustfmt-normalize
  cancel-in-progress: true

jobs:
  rustfmt:
    if: github.actor == 'ahmedsaturki'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --all
      - name: Commit normalized formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust formatting already normalized."
            exit 0
          fi
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/src-tauri
          git commit -m "style(rust): normalize rustfmt output [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
