name: One-off readiness formatting

on:
  push:
    branches:
      - feat/release-readiness-gate-20260926

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/FINAL_EXTERNAL_ACTIONS.md docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md docs/VERIFICATION_BLOCKERS.md release/readiness.json scripts/verify-release-readiness.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/FINAL_EXTERNAL_ACTIONS.md docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md docs/VERIFICATION_BLOCKERS.md release/readiness.json scripts/verify-release-readiness.mjs; then
            exit 0
          fi
          git add docs/FINAL_EXTERNAL_ACTIONS.md docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md docs/VERIFICATION_BLOCKERS.md release/readiness.json scripts/verify-release-readiness.mjs
          git commit -m "style(release): apply project formatter"
          git push
