name: One-off format repair

on:
  push:
    branches:
      - feat/publishing-calendar-20260926

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/src/campaigns/bulkPlanner.ts packages/desktop/src/components/BulkPlannerPanel.tsx packages/desktop/src/components/ResearchStudioPanel.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packages/core/src/campaigns/bulkPlanner.ts packages/desktop/src/components/BulkPlannerPanel.tsx packages/desktop/src/components/ResearchStudioPanel.tsx; then
            exit 0
          fi
          git add packages/core/src/campaigns/bulkPlanner.ts packages/desktop/src/components/BulkPlannerPanel.tsx packages/desktop/src/components/ResearchStudioPanel.tsx
          git commit -m "style: apply project prettier to publishing surfaces"
          git push
