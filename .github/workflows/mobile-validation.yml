name: Mobile Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/mobile/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-mobile-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Require committed lockfile
        run: test -s pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Mobile typecheck
        run: pnpm --filter @orbit/mobile typecheck
      - name: Mobile tests
        run: pnpm --filter @orbit/mobile test
      - name: Generate Android native project
        run: pnpm --dir packages/mobile exec expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mobile-android-debug-validation
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
