name: Runner Probe

on:
  push:
    branches: ["rebuild/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe runner
        run: |
          echo "runner-started"
          node --version
          pnpm --version || true
          rustc --version || true
