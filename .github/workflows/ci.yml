name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "rebuild/orbit-production-final"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "10.17.1"

      - name: Require committed lockfiles
        run: test -f pnpm-lock.yaml
      - name: Require desktop Cargo.lock
        run: test -f packages/desktop/src-tauri/Cargo.lock

      - name: Release sanity
        run: pnpm verify:release
      - name: Release evidence collector contract
        run: pnpm test:release-evidence-collector

      - name: Readiness contract
        run: pnpm verify:readiness -- --mode verification
      - name: Readiness verifier contract test
        run: node scripts/verify-release-readiness.test.mjs
      - name: Live production observation contract
        run: pnpm verify:production-observation
      - name: Agent release triage contract
        run: |
          node scripts/agent-release-triage.mjs > /tmp/orbit-release-triage.json
          cat > /tmp/verify-triage.mjs <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync("/tmp/orbit-release-triage.json", "utf8"),
          );
          if (report.repository !== "ahmedsaturki/ORBIT-MARKETING-OS") {
            throw new Error("agent triage repository mismatch");
          }
          const expectedSha = execFileSync(
            "git",
            ["rev-parse", "HEAD"],
            { encoding: "utf8" },
          ).trim();
          if (report.git.sha !== expectedSha) {
            throw new Error("agent triage SHA does not match checked-out HEAD");
          }
          if (!Array.isArray(report.nextActions)) {
            throw new Error("agent triage nextActions must be an array");
          }
          NODE
          node /tmp/verify-triage.mjs
      - name: OMP contract
        run: pnpm verify:omp

      - name: Durable release docs contract
        run: pnpm verify:release-docs
      - name: Vercel ignore command contract
        run: node scripts/vercel-ignore.test.mjs
      - name: Production release trigger contract
        run: node scripts/production-release-trigger.test.mjs
      - name: Stability soak runner resilience contract
        run: pnpm test:soak-runner-resilience
      - name: Package manager spawn resolution contract
        run: pnpm test:spawn-helper
      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Reproducible install
        run: pnpm install --frozen-lockfile

      - name: Commercial connector proof safety
        run: pnpm test:commercial-proof

      - name: Governed node-forge audit exception
        run: pnpm test:node-forge-audit-exception

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Desktop IPC contract
        run: pnpm verify:ipc

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Core coverage
        run: pnpm --filter @orbit/core test:coverage

      - name: Governed CLI/MCP surface smoke
        run: pnpm test:surface

      - name: Runtime smoke
        timeout-minutes: 3
        run: pnpm test:runtime

      - name: Performance smoke
        timeout-minutes: 3
        run: pnpm test:performance

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Web E2E
        timeout-minutes: 5
        run: pnpm test:e2e

      - name: Accessibility and RTL audit
        timeout-minutes: 5
        run: pnpm exec playwright test e2e/accessibility-rtl.spec.ts

      - name: Format check
        run: pnpm format:check

  security_scan:
    name: security:scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "10.17.1"

      - name: Require committed lockfiles
        run: |
          test -s pnpm-lock.yaml
          test -s packages/desktop/src-tauri/Cargo.lock

      - name: Reproducible install
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm security:scan
      - name: Secret scan contract test
        run: pnpm test:security:scan

  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Require Cargo lockfile
        run: test -s packages/desktop/src-tauri/Cargo.lock
      - name: Install JavaScript dependencies for Tauri icon generation
        run: pnpm install --frozen-lockfile
      - name: Generate Tauri icons
        run: pnpm --dir packages/desktop tauri icon src-tauri/icon-source.svg
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust format
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Rust check
        working-directory: packages/desktop/src-tauri
        run: cargo check --workspace --all-targets
      - name: Rust tests
        timeout-minutes: 20
        working-directory: packages/desktop/src-tauri
        run: cargo test --workspace --all-targets
      - name: Recovery evidence
        timeout-minutes: 5
        run: pnpm test:recovery:evidence
      - name: Upload recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-recovery-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/recovery-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Search scale benchmark
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml contact_search_1000_scale_benchmark -- --nocapture
      - name: Startup and memory benchmark
        run: pnpm benchmark:startup-memory

      - name: Rust clippy
        working-directory: packages/desktop/src-tauri
        env:
          RUSTFLAGS: --check-cfg=cfg(feature,values("custom-protocol","e2e-cdp"))
        run: cargo clippy --workspace --all-targets -- -D warnings
