name: One-off formatter

on:
  push:
    branches:
      - feat/release-readiness-gate-20260926

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/verify-release-readiness.mjs scripts/verify-release-readiness.test.mjs scripts/verify-vercel-dry-run.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-release-readiness.mjs scripts/verify-release-readiness.test.mjs scripts/verify-vercel-dry-run.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: apply project formatter"
          git push
