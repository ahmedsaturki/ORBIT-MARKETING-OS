name: Link Integrity

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "13 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-link-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: link-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned existing checkout
        with:
          persist-credentials: false

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            './README.md'
            './CHANGELOG.md'
            './SECURITY.md'
            './docs/**/*.md'
          fail: false
