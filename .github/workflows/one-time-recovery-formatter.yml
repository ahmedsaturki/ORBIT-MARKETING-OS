name: One-time recovery evidence formatter

on:
  push:
    branches:
      - feat/recovery-evidence-consolidation-2026-09-28

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Format recovery evidence script
        run: pnpm dlx prettier@3.9.9 --write scripts/recovery-evidence.mjs

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/recovery-evidence.mjs; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/recovery-evidence.mjs
          git commit -m "style(recovery): apply Prettier 3.9.9 formatting"
          git push
