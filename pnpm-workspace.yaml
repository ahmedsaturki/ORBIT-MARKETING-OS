packages:
  - "packages/*"

# pnpm >=10 no longer reads the `pnpm` field from package.json; these settings
# must live here or they are silently ignored.
overrides:
  query-string>decode-uri-component: 0.5.0
  xcode>uuid: 11.1.1

# Backport of the proposed fix digitalbazaar/forge#1152 for CVE-2026-85393
# (GHSA-86w9-cpqp-85rv). node-forge has no released fix: 1.4.0 is the latest
# version and the advisory declares firstPatchedVersion = null. PR #1152 is open
# and not merged; its only approval is from a non-maintainer contributor, so this
# is a community-proposed fix, not maintainer-endorsed. It was selected because it
# is the most complete fix proposed upstream. Review the patch before trusting it.
patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch

# Temporary, explicit governance exception for an unfixable advisory.
# The matching CI contract requires the local patch + regression test and a review
# date; every other advisory must still fail `pnpm audit`.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
