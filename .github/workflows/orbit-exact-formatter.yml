name: ORBIT Exact Formatter

on:
  push:
    branches: ["fix/explicit-production-release-trigger-20260928"]

permissions:
  contents: write

jobs:
  format-once:
    if: !contains(github.event.head_commit.message, '[format-once]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact release-control files and self-delete
        run: |
          set -euo pipefail
          pnpm exec prettier --write \\
            scripts/release-sanity.mjs \\
            scripts/resolve-production-release.mjs \\
            scripts/test-git-fixture.mjs \\
            scripts/vercel-ignore.test.mjs
          git diff --check
          if git diff --quiet -- \\
            scripts/release-sanity.mjs \\
            scripts/resolve-production-release.mjs \\
            scripts/test-git-fixture.mjs \\
            scripts/vercel-ignore.test.mjs; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/orbit-exact-formatter.yml
          git add \\
            scripts/release-sanity.mjs \\
            scripts/resolve-production-release.mjs \\
            scripts/test-git-fixture.mjs \\
            scripts/vercel-ignore.test.mjs \\
            .github/workflows/orbit-exact-formatter.yml
          git commit -m "style(release): apply exact Prettier output [format-once]"
          git push origin HEAD:fix/explicit-production-release-trigger-20260928
