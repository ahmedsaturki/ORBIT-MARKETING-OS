name: ORBIT Temporary Exact Formatter

on:
  push:
    branches: ["release/commercial-production-proof-20260927"]

permissions:
  contents: write

concurrency:
  group: orbit-temp-exact-formatter
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Exact Prettier formatting
        run: pnpm exec prettier --write scripts/commercial-connector-proof.safe.test.mjs scripts/verify-release-readiness.mjs scripts/verify-release-readiness.test.mjs

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/commercial-connector-proof.safe.test.mjs scripts/verify-release-readiness.mjs scripts/verify-release-readiness.test.mjs
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "style: apply canonical prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
