name: ORBIT PR Formatting

on:
  push:
    branches: ["chore/reconcile-current-release-evidence-20260926"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format canonical release docs
        run: pnpm exec prettier --write docs/IMPLEMENTATION_STATUS.md docs/LAUNCH_SCORECARD.md docs/PRODUCT_SURFACE_MATRIX.md docs/RELEASE_SCORECARD.md
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_STATUS.md docs/LAUNCH_SCORECARD.md docs/PRODUCT_SURFACE_MATRIX.md docs/RELEASE_SCORECARD.md
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "style: canonicalize release docs formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
