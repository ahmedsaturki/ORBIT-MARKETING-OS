name: One-off React security refresh

on:
  push:
    branches:
      - chore/reconcile-current-release-evidence-20260926

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm up -r react@19.2.8 react-dom@19.2.8
      - run: pnpm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json packages/web/package.json packages/mobile/package.json packages/shared-ui/package.json pnpm-lock.yaml; then
            exit 0
          fi
          git add package.json packages/web/package.json packages/mobile/package.json packages/shared-ui/package.json pnpm-lock.yaml
          git commit -m "fix(security): refresh React runtime packages"
          git push
