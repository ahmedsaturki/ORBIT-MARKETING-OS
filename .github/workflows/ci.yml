name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/**", "rebuild/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "10.17.1"

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Reproducible install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Desktop IPC contract
        run: pnpm verify:ipc

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Core coverage
        run: pnpm --filter @orbit/core test:coverage

      - name: Runtime smoke
        run: pnpm test:runtime

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Web E2E
        run: pnpm test:e2e

      - name: Format check
        run: pnpm format:check
