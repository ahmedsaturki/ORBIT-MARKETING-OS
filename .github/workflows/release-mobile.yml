name: Mobile Validation Artifact


concurrency:
  group: orbit-.github-workflows-release-mobile.yml-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Mobile release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify release commit belongs to main release line
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release sanity
        run: pnpm verify:release

      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Secret scan
        run: pnpm security:scan

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Performance smoke
        run: pnpm test:performance

      - name: Desktop IPC contract
        run: pnpm verify:ipc
      - name: Mobile typecheck
        run: pnpm --filter @orbit/mobile typecheck
      - name: Mobile tests
        run: pnpm --filter @orbit/mobile test

  android-debug:
    name: Android debug validation APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify:workspace

      - name: Generate Android native project
        run: pnpm --dir packages/mobile exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: packages/mobile/android
        shell: bash
        env:
          CI: "1"
        run: |
          set -euo pipefail
          timeout 30m ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 assembleDebug


      - name: Upload Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-mobile-android-debug-validation
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
