name: Temporary Release Formatting

on:
  push:
    branches:
      - chore/release-truth-20260929

permissions:
  contents: write

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: pnpm exec prettier --write docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json scripts/verify-live-production-observation.mjs
      - name: Verify formatting
        run: pnpm format:check
      - name: Commit formatted files and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json scripts/verify-live-production-observation.mjs
          git rm .github/workflows/_temporary-release-format.yml
          git commit -m "style(release): apply exact repository formatting"
          git push origin HEAD:chore/release-truth-20260929
