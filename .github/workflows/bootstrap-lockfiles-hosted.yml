name: Bootstrap lockfiles on hosted runner

on:
  workflow_dispatch:
  push:
    branches: ["rebuild/orbit-production-consolidated"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref_name == 'rebuild/orbit-production-consolidated' && github.actor == 'ahmedsaturki'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Generate JavaScript lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Generate Rust lockfile
        working-directory: packages/desktop/src-tauri
        run: cargo generate-lockfile

      - name: Verify generated lockfiles
        run: |
          test -s pnpm-lock.yaml
          test -s packages/desktop/src-tauri/Cargo.lock

      - name: Verify workspace contract
        run: pnpm verify:workspace

      - name: Commit lockfiles
        run: node scripts/commit-lockfiles.mjs
