name: Mobile Validation Artifact


concurrency:
  group: orbit-.github-workflows-release-mobile.yml-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Mobile release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify release commit belongs to rebuild line
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin rebuild/orbit-production:refs/remotes/origin/rebuild/orbit-production
          git merge-base --is-ancestor "$GITHUB_SHA" origin/rebuild/orbit-production

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release sanity
        run: pnpm verify:release

      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Secret scan
        run: pnpm security:scan

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Performance smoke
        run: pnpm test:performance

      - name: Desktop IPC contract
        run: pnpm verify:ipc
      - name: Mobile typecheck
        run: pnpm --filter @orbit/mobile typecheck
      - name: Mobile tests
        run: pnpm --filter @orbit/mobile test

  android-debug:
    name: Android debug validation APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify:workspace

      - name: Generate Android native project
        run: pnpm --dir packages/mobile exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbit-mobile-android-debug-validation
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
