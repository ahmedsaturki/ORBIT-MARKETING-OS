[package]
name = "orbit-marketing-os"
version = "1.0.0"
description = "ORBIT Marketing OS desktop runtime"
authors = ["ORBIT Marketing OS"]
edition = "2021"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orbit-marketing-os"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e-cdp = []

[dependencies]
aes-gcm = "0.10"
argon2 = "0.6"
base64 = "0.23"
ed25519-dalek = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
zeroize = "1"

# Local test builds omit debug info: a full Tauri debug build with debuginfo=2
# needs several GB, which does not fit on constrained CI/dev disks.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

# Build scripts and proc-macros are compiled under their own profile; without
# this they still emit a program database and trip MSVC's LNK1140 size cap.
[profile.dev.build-override]
debug = 0

# On Windows/MSVC the linker still emits a program database and aborts with
# LNK1140 once it exceeds its size cap. Build with
# `RUSTFLAGS="-C link-arg=/PDB:NONE"` to suppress it; the flag has no effect
# when set in this manifest.
