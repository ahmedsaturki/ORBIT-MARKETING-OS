name: ORBIT Temporary Soak Formatter

on:
  push:
    branches: ["fix/soak-failure-evidence-20260927"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/soak.ts scripts/soak-failure-evidence.test.mjs package.json .github/workflows/stability-soak.yml
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/soak.ts scripts/soak-failure-evidence.test.mjs package.json .github/workflows/stability-soak.yml
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style(soak): normalize formatter output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
