name: Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Format check
        run: pnpm format:check

  build:
    name: Build ${{ matrix.os }}
    permissions:
      contents: read
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to rebuild line
        shell: bash
        run: |
          git fetch origin rebuild/orbit-production:refs/remotes/origin/rebuild/orbit-production
          git merge-base --is-ancestor "$GITHUB_SHA" origin/rebuild/orbit-production

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify workspace
        run: pnpm verify:workspace

      - name: Generate app icons
        run: pnpm --dir packages/desktop tauri icon src-tauri/icon-source.svg

      - name: Build desktop
        run: pnpm --dir packages/desktop tauri build

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: orbit-desktop-${{ runner.os }}
          path: packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orbit-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Build release manifest
        shell: bash
        run: |
          cat > release-assets/RELEASE-MANIFEST.txt <<EOF
          product=ORBIT Marketing OS
          version=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          source=verified-rebuild-orbit-production-lineage
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          signing=unsigned
          EOF

      - name: Build checksums
        shell: bash
        run: |
          find release-assets -type f -not -name 'SHA256SUMS.txt' -print0             | sort -z             | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f ! -name 'SHA256SUMS.txt' -print0)
          test "${#ASSETS[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}"             --title "ORBIT Marketing OS ${{ github.ref_name }} — validation build"             --prerelease --generate-notes             release-assets/SHA256SUMS.txt             "${ASSETS[@]}"
