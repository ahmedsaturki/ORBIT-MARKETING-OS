name: Temporary Release Truth Formatter

on:
  push:
    branches: ["fix/release-truth-main-20261003"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format release-truth files
        run: pnpm exec prettier --write docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format release-truth files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
