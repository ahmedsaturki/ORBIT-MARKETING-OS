name: Format Rebuild Branch

on:
  push:
    branches: ["rebuild/orbit-production-final"]

permissions:
  contents: write

concurrency:
  group: orbit-format-rebuild
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Require committed lockfile
        run: test -s pnpm-lock.yaml

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm exec prettier --write .

      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "style: normalize repository formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
