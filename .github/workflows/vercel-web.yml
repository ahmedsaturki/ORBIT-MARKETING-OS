name: Web Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Web quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install workspace
        run: bash scripts/vercel-install.sh
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Web typecheck
        run: pnpm --filter @orbit/web typecheck
      - name: Web lint
        run: pnpm --filter @orbit/web lint
      - name: Web build
        run: pnpm --filter @orbit/web build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web E2E
        run: pnpm test:e2e

  release_trigger:
    name: Production release trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      triggered: ${{ steps.resolve.outputs.release_current }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Resolve production release
        id: resolve
        run: node scripts/resolve-production-release.mjs

  vercel_mode:
    name: Vercel release mode
    needs: [quality, release_trigger]
    if: needs.release_trigger.outputs.triggered == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      credentials: ${{ steps.detect.outputs.credentials }}
    steps:
      - name: Detect Vercel release credentials
        id: detect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "credentials=true" >> "$GITHUB_OUTPUT"
            echo "Using credential-backed prebuilt deployment."
          else
            echo "credentials=false" >> "$GITHUB_OUTPUT"
            echo "Using governed Vercel Git production deployment."
          fi

  deploy:
    needs: [quality, release_trigger, vercel_mode]
    if: needs.release_trigger.outputs.triggered == 'true' && needs.vercel_mode.outputs.credentials == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release_trigger.outputs.release_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pull Vercel project settings
        run: pnpm dlx vercel@59.23.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Verify Vercel dry-run framework
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@59.23.1 deploy --dry --format=json --token="$VERCEL_TOKEN" > vercel-dry-run.json
          node scripts/verify-vercel-dry-run.mjs
      - name: Build Vercel output
        run: pnpm dlx vercel@59.23.1 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_ORBIT_RELEASE_SHA: ${{ needs.release_trigger.outputs.release_sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy prebuilt output
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@59.23.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
          grep -q "Production:" vercel-deploy.log
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' vercel-deploy.log | tail -1)"
          test -n "$deployment_url"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Verify live rebuild surface
        env:
          ORBIT_LIVE_URL: ${{ steps.deploy.outputs.url }}
          ORBIT_EXPECTED_RELEASE_SHA: ${{ needs.release_trigger.outputs.release_sha }}
        run: node scripts/verify-live-web.mjs

  git_provenance:
    name: Vercel Git provenance
    needs: [quality, release_trigger, vercel_mode]
    if: needs.release_trigger.outputs.triggered == 'true' && needs.vercel_mode.outputs.credentials == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Git deployment and live provenance
        env:
          ORBIT_LIVE_URL: https://orbit-marketing-os.vercel.app
          ORBIT_EXPECTED_RELEASE_SHA: ${{ needs.release_trigger.outputs.release_sha }}
        run: node scripts/verify-public-vercel-provenance.mjs
      - name: Verify full live web surface
        env:
          ORBIT_LIVE_URL: https://orbit-marketing-os.vercel.app
          ORBIT_EXPECTED_RELEASE_SHA: ${{ needs.release_trigger.outputs.release_sha }}
        run: node scripts/verify-live-web.mjs
