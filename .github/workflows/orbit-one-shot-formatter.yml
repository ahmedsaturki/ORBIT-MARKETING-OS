name: ORBIT One Shot Formatter

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[format-bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Require lockfile
        run: test -s pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format target files
        run: pnpm exec prettier --write docs/ACCEPTANCE_MATRIX_V2.md docs/COMMAND_MODEL.md docs/IMPLEMENTATION_STATUS.md docs/LAUNCH_SCORECARD.md docs/PRODUCT_SURFACE_MATRIX.md docs/RELEASE_READINESS.md docs/RELEASE_SCORECARD.md docs/VERIFICATION_BLOCKERS.md packages/core/src/commands/dispatcher.ts packages/core/src/commands/dispatcher.test.ts packages/core/src/commands/index.ts

      - name: Remove temporary formatter
        run: rm -f .github/workflows/orbit-one-shot-formatter.yml

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "style: normalize dispatcher release docs [format-bot]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
