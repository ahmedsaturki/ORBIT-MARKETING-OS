name: Desktop Native Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/desktop/**"
      - "packages/core/**"
      - "packages/shared-ui/**"
      - "scripts/build-tauri.mjs"
      - "scripts/build-icon.mjs"
      - "e2e/tauri-shell.spec.ts"
      - "scripts/verify-windows-e2e-artifact.mjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-desktop-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Require committed lockfiles
        shell: bash
        run: |
          test -s pnpm-lock.yaml
          test -s packages/desktop/src-tauri/Cargo.lock
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Generate app icons
        run: pnpm --dir packages/desktop tauri icon src-tauri/icon-source.svg
      - name: Build desktop
        run: pnpm --dir packages/desktop tauri build
      - name: Build Windows E2E desktop
        if: matrix.artifact == 'windows-x64'
        timeout-minutes: 20
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/desktop/src-tauri/target/e2e-cdp
        run: pnpm --dir packages/desktop tauri build --features e2e-cdp
      - name: Stage Windows executable for native E2E
        if: matrix.artifact == 'windows-x64'
        shell: pwsh
        run: |
          $exe = "packages/desktop/src-tauri/target/e2e-cdp/release/orbit-marketing-os.exe"
          if (!(Test-Path $exe)) { throw "Windows E2E Tauri build did not produce orbit-marketing-os.exe" }
          $dest = "packages/desktop/src-tauri/target/release/bundle/native-e2e"
          $schema = "packages/desktop/src-tauri/gen/schemas/capabilities.json"
          if (!(Test-Path $schema)) { throw "Tauri build did not produce gen/schemas/capabilities.json" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $exe "$dest/orbit-marketing-os.exe" -Force
          Copy-Item $schema "$dest/capabilities.json" -Force
      - name: Upload desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-desktop-${{ matrix.artifact }}
          path: packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  windows-e2e:
    name: Windows native E2E
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Require committed lockfiles
        shell: pwsh
        run: |
          if (!(Test-Path pnpm-lock.yaml)) { exit 1 }
          if (!(Test-Path packages/desktop/src-tauri/Cargo.lock)) { exit 1 }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified Windows desktop bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: orbit-desktop-windows-x64
          path: native-desktop

      - name: Locate verified desktop executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path native-desktop -Recurse -Filter orbit-marketing-os.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "Verified Windows desktop artifact did not contain orbit-marketing-os.exe" }
          $schema = Get-ChildItem -Path native-desktop -Recurse -Filter capabilities.json | Select-Object -First 1
          if ($null -eq $schema) { throw "Verified Windows desktop artifact did not contain capabilities.json" }
          "TAURI_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORBIT_CAPABILITIES_SCHEMA=$($schema.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify downloaded Windows executable
        run: node scripts/verify-windows-e2e-artifact.mjs

      - name: Build web surface for native E2E server
        timeout-minutes: 10
        run: pnpm --dir packages/web build

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install chromium
      - name: Run native and web E2E
        timeout-minutes: 20
        run: pnpm test:e2e
