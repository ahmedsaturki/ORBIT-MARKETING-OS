name: Mobile Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/mobile/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-mobile-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - name: Require committed lockfile
        run: test -s pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Mobile typecheck
        run: pnpm --filter @orbit/mobile typecheck
      - name: Mobile tests
        run: pnpm --filter @orbit/mobile test
      - name: Generate Android native project
        run: pnpm --dir packages/mobile exec expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: packages/mobile/android
        shell: bash
        env:
          CI: "1"
        run: |
          set -euo pipefail
          timeout 30m ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-mobile-android-debug-validation
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
