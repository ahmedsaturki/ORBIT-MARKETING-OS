name: Temporary release-doc formatter

on:
  push:
    branches:
      - docs/reconcile-current-production-evidence-20260928

permissions:
  contents: write

jobs:
  format-release-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/reconcile-current-production-evidence-20260928
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format exact release docs with repository Prettier
        run: pnpm exec prettier --write docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json
      - name: Commit formatted output
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json
          git commit -m "chore(release): apply repository Prettier formatting"
          git push origin HEAD:docs/reconcile-current-production-evidence-20260928
