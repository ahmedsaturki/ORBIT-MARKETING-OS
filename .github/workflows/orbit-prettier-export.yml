name: ORBIT Temporary Prettier Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-formatted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/ACCEPTANCE_MATRIX_V2.md docs/API.md docs/RESEARCH_INTELLIGENCE.md e2e/tauri-shell.spec.ts packages/core/src/commands/index.test.ts packages/core/src/commands/index.ts packages/core/src/research/index.ts packages/desktop/src/components/ResearchStudioPanel.tsx
      - run: tar -czf /tmp/orbit-prettier-export.tgz docs/ACCEPTANCE_MATRIX_V2.md docs/API.md docs/RESEARCH_INTELLIGENCE.md e2e/tauri-shell.spec.ts packages/core/src/commands/index.test.ts packages/core/src/commands/index.ts packages/core/src/research/index.ts packages/desktop/src/components/ResearchStudioPanel.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-prettier-export
          path: /tmp/orbit-prettier-export.tgz
          if-no-files-found: error
