name: Temporary Release Formatting

on:
  push:
    branches:
      - chore/release-truth-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Format release-truth files
        run: pnpm exec prettier --write docs/LAUNCH_SCORECARD.md docs/RELEASE_SCORECARD.md release/readiness.json scripts/verify-live-production-observation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-release-format
          path: |
            docs/LAUNCH_SCORECARD.md
            docs/RELEASE_SCORECARD.md
            release/readiness.json
            scripts/verify-live-production-observation.mjs
          retention-days: 1
