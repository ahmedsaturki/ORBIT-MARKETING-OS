name: One-shot Prettier repair

on:
  push:
    branches: ["chore/finalize-native-cleanup-20260925"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'ahmedsaturki' && !contains(github.event.head_commit.message, 'one-shot prettier repair')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format exact failing E2E file
        run: pnpm exec prettier --write e2e/tauri-shell.spec.ts
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tauri-shell.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting delta."
            exit 0
          fi
          git commit -m "chore(ci): one-shot prettier repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
