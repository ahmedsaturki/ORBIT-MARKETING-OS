name: One-shot branch formatting helper

on:
  push:
    branches:
      - feature/experiment-inference-20260926

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/src/experiments/index.ts packages/core/src/experiments/inference.ts packages/core/src/experiments/inference.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "prettier_changes=none"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/experiments/index.ts packages/core/src/experiments/inference.ts packages/core/src/experiments/inference.test.ts
          git commit -m "style: apply canonical prettier formatting"
          git push
