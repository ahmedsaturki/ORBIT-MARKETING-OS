name: Rebuild Rust


concurrency:
  group: orbit-.github-workflows-rebuild-rust.yml-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Rust workspace
        id: detect
        shell: bash
        run: |
          if [ -f packages/desktop/src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux desktop dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Require committed Cargo.lock
        if: steps.detect.outputs.present == 'true'
        run: test -f packages/desktop/src-tauri/Cargo.lock
        working-directory: .

      - name: Install Rust
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Rust format
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check
        working-directory: packages/desktop/src-tauri

      - name: Rust check
        if: steps.detect.outputs.present == 'true'
        run: cargo check --locked --workspace --all-targets
        working-directory: packages/desktop/src-tauri

      - name: Rust tests
        if: steps.detect.outputs.present == 'true'
        run: cargo test --locked --workspace --all-targets
        working-directory: packages/desktop/src-tauri

      - name: Clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: packages/desktop/src-tauri

      - name: Report missing desktop backend
        if: steps.detect.outputs.present != 'true'
        run: echo "::notice::Desktop Rust backend is not present yet; Rust gates remain pending until the runtime tranche lands."
