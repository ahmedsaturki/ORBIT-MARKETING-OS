name: Mobile Validation Artifact

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Mobile release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Mobile typecheck
        run: pnpm --filter @orbit/mobile typecheck
      - name: Mobile tests
        run: pnpm --filter @orbit/mobile test

  android-debug:
    name: Android debug validation APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify workspace
        run: pnpm verify:workspace

      - name: Generate Android native project
        run: pnpm --dir packages/mobile exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mobile-android-debug-validation
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
