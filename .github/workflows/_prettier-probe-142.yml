name: Temporary Prettier Probe 142

on:
  push:
    branches:
      - docs/reconcile-current-main-20260928-367c0de

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier docs/LAUNCH_SCORECARD.md > /tmp/LAUNCH_SCORECARD.md
          pnpm exec prettier docs/RELEASE_SCORECARD.md > /tmp/RELEASE_SCORECARD.md
      - run: |
          diff -u docs/LAUNCH_SCORECARD.md /tmp/LAUNCH_SCORECARD.md || true
          diff -u docs/RELEASE_SCORECARD.md /tmp/RELEASE_SCORECARD.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-probe-142
          path: |
            /tmp/LAUNCH_SCORECARD.md
            /tmp/RELEASE_SCORECARD.md
