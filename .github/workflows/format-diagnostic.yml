name: Format Diagnostic

on:
  push:
    branches: ["chore/omp-release-control-2026-09-28"]

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: \${{ github.event.after }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: pnpm exec prettier --write scripts/agent-release-triage.mjs scripts/startup-memory-benchmark.mjs
      - name: Print formatter diff
        run: git diff -- scripts/agent-release-triage.mjs scripts/startup-memory-benchmark.mjs
