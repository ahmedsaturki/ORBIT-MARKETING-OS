name: One-off web format repair

on:
  push:
    branches:
      - feat/web-release-provenance-20260926

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write e2e/public-web.spec.ts scripts/verify-live-web.mjs
      - shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/public-web.spec.ts scripts/verify-live-web.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(web): normalize provenance verifier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
