name: One-off Prettier repair PR29

on:
  push:
    branches: ["test/crdt-transport-integration-20260925"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format target
        run: pnpm exec prettier --write packages/core/test/sync.test.ts
      - name: Emit formatted target
        shell: bash
        run: |
          echo "----- BEGIN FORMATTED FILE -----"
          cat packages/core/test/sync.test.ts
          echo "----- END FORMATTED FILE -----"
