name: ORBIT PR67 normalization
on:
  push:
    branches:
      - feat/orbit-unified-search-research-20260926

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix Rust search fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/desktop/src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          opening = '                "INSERT INTO workspaces(id, name, created_at)'
          closing = "'https://example.com', '1');","
          start = text.find(opening)
          if start == -1:
              raise SystemExit("search fixture opening not found")
          end = text.find(closing, start)
          if end == -1:
              raise SystemExit("search fixture closing not found")
          if text[start:start + 3] == 'r#"':
              raise SystemExit(0)

          text = text[:start] + '                r#"INSERT INTO workspaces(id, name, created_at)' + text[start + len(opening):]
          end = text.find(closing, start)
          if end == -1:
              raise SystemExit("search fixture closing moved unexpectedly")
          replacement = "'https://example.com', '1');"#,"
          text = text[:end] + replacement + text[end + len(closing):]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Rust format
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --all

      - name: Prettier changed surfaces
        run: pnpm exec prettier --write           docs/ACCEPTANCE_MATRIX_V2.md           docs/API.md           docs/LAUNCH_SCORECARD.md           docs/PRODUCT_SURFACE_MATRIX.md           e2e/tauri-shell.spec.ts           packages/desktop/src/App.tsx

      - name: Commit normalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_normalize-orbit-pr67.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git commit -m "fix: normalize search branch formatting and fixture"
          git push
