name: Temporary Native Docs Formatter

on:
  push:
    branches: ["fix/native-e2e-current-main"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/DESKTOP_NATIVE_TESTING.md
      - name: Commit formatting
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DESKTOP_NATIVE_TESTING.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format native desktop testing guide"
          git push origin "HEAD:${GITHUB_REF_NAME}"
