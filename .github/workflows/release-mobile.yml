name: Mobile Validation Artifact


concurrency:
  group: orbit-.github-workflows-release-mobile.yml-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Mobile release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify release commit belongs to rebuild line
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin rebuild/orbit-production:refs/remotes/origin/rebuild/orbit-production
          git merge-base --is-ancestor "$GITHUB_SHA" origin/rebuild/orbit-production

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Desktop IPC contract
        run: pnpm verify:ipc
      - name: Mobile typecheck
        run: pnpm --filter @orbit/mobile typecheck
      - name: Mobile tests
        run: pnpm --filter @orbit/mobile test

  android-debug:
    name: Android debug validation APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify:workspace

      - name: Generate Android native project
        run: pnpm --dir packages/mobile exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mobile-android-debug-validation
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
