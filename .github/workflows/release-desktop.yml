name: Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # fetch-depth 0 so the tag ancestry pre-flight has the full graph to
      # reason over; a shallow clone makes `merge-base --is-ancestor` unreliable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      # Cheap pre-flight, before the ~5 minute gate battery. The build job
      # repeats this as `Verify release commit belongs to main release line`,
      # but only after four Tauri builds have already been dispatched across
      # the matrix. A tag pushed from a branch that is not merged to main fails
      # there, wasting the whole matrix — tag v1.0.0 is currently in exactly
      # that state, 89 commits ahead of origin/main on an audit branch.
      - name: Verify tag is on the main release line
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main."
            echo "::error::Merge the commit to main and re-tag; the release build job enforces the same rule."
            git log --oneline -5 origin/main.."$GITHUB_SHA" || true
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on the main release line."
      - name: Require committed lockfiles
        run: test -f pnpm-lock.yaml
      - name: Require desktop Cargo.lock
        run: test -f packages/desktop/src-tauri/Cargo.lock
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Secret scan
        run: pnpm security:scan
      - name: Governed audit exceptions

        run: pnpm test:node-forge-audit-exception



      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Desktop IPC contract
        run: pnpm verify:ipc
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Release sanity
        run: pnpm verify:release
      - name: Release readiness contract
        run: pnpm verify:readiness -- --mode verification

      - name: Core coverage
        run: pnpm --filter @orbit/core test:coverage

      - name: Runtime smoke
        run: pnpm test:runtime

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Performance smoke
        run: pnpm test:performance

      # The E2E suite serves packages/web/out through scripts/static-server.mjs,
      # so the web export must exist before Playwright starts. Running this
      # before the build made the quality gate fail with
      # "Timed out waiting 30000ms from config.webServer" on run 37205123765.
      # ci.yml orders Build (163) before Web E2E (174); match that.
      - name: Build
        run: pnpm build

      - name: Browser E2E
        run: pnpm test:e2e
      - name: Format check
        run: pnpm format:check

  build:
    name: Build ${{ matrix.os }}
    permissions:
      contents: read
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main release line
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify:workspace

      - name: Generate app icons
        run: pnpm --dir packages/desktop tauri icon src-tauri/icon-source.svg

      - name: Build desktop
        run: pnpm --dir packages/desktop tauri build

      - name: Upload desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orbit-desktop-${{ matrix.artifact }}
          path: packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: orbit-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Build release manifest
        shell: bash
        run: |
          cat > release-assets/RELEASE-MANIFEST.txt <<EOF
          product=ORBIT Marketing OS
          version=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          source=verified-main-lineage
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          signing=unsigned
          EOF

      - name: Build checksums
        shell: bash
        run: |
          find release-assets -type f -not -name 'SHA256SUMS.txt' -print0             | sort -z             | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f ! -name 'SHA256SUMS.txt' -print0)
          test "${#ASSETS[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}"             --title "ORBIT Marketing OS ${{ github.ref_name }} — validation build"             --prerelease --generate-notes             release-assets/SHA256SUMS.txt             "${ASSETS[@]}"
