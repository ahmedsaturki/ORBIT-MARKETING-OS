name: Browser Compatibility

on:
  pull_request:
    branches: ["main"]
    paths:
      - "e2e/**"
      - "packages/web/**"
      - "packages/shared-ui/**"
      - "scripts/static-server.mjs"
      - "playwright.compat.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/browser-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-browser-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright - ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static web
        run: pnpm --dir packages/web build

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E
        run: pnpm exec playwright test --config=playwright.compat.config.ts --project=${{ matrix.browser }}
