name: Web Deploy


concurrency:
  group: orbit-.github-workflows-vercel-web.yml-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Web quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install workspace
        run: bash scripts/vercel-install.sh
      - name: Workspace sanity
        run: pnpm verify:workspace
      - name: Web typecheck
        run: pnpm --filter @orbit/web typecheck
      - name: Web lint
        run: pnpm --filter @orbit/web lint
      - name: Web build
        run: pnpm --filter @orbit/web build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web E2E
        run: pnpm test:e2e

  deploy:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check Vercel credentials
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment is disabled until VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are configured."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.enabled == 'true'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm dlx vercel@59.23.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vercel dry-run framework
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@59.23.1 deploy --dry --format=json --token="$VERCEL_TOKEN" > vercel-dry-run.json
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('vercel-dry-run.json','utf8')); const text=JSON.stringify(data); if (!/nextjs/i.test(text)) { console.error('Vercel dry-run did not detect Next.js'); process.exit(1); } console.log('Vercel dry-run detected Next.js');"

      - name: Build Vercel output
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm dlx vercel@59.23.1 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@59.23.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
          grep -q "Production:" vercel-deploy.log
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' vercel-deploy.log | tail -1)"
          test -n "$deployment_url"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify live rebuild surface
        if: steps.gate.outputs.enabled == 'true'
        env:
          ORBIT_LIVE_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/verify-live-web.mjs