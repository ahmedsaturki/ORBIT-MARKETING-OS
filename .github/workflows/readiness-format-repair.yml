name: ORBIT readiness formatting repair

on:
  push:
    branches:
      - chore/format-readiness-20260927

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write release/readiness.json
      - shell: bash
        run: |
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(release): format readiness ledger"
          git push origin HEAD:chore/format-readiness-20260927
