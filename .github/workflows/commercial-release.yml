name: ORBIT Commercial Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Commercial release version, e.g. v1.0.0"
        required: true
        type: string
      confirm:
        description: "Type COMMERCIAL to authorize the release lane"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: orbit-commercial-release
  cancel-in-progress: false

jobs:
  readiness:
    name: Commercial readiness gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify release authorization
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "COMMERCIAL"

      - name: Require main release lineage
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$VERSION"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version must look like vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require committed lockfiles
        run: |
          test -s pnpm-lock.yaml
          test -s packages/desktop/src-tauri/Cargo.lock

      - name: Install reproducibly
        run: pnpm install --frozen-lockfile

      - name: Verify commercial readiness
        run: pnpm verify:readiness -- --mode commercial

  publish:
    name: Publish commercial release
    needs: readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Stop
        run: |
          echo "Commercial readiness passed. Attach the signed/notarized, store-approved and provenance-verified release artifacts before enabling this publish step."
          exit 1
