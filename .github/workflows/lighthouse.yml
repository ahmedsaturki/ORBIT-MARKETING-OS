name: Lighthouse Web Quality

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/web/**"
      - "packages/shared-ui/**"
      - "e2e/**"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
      - "pnpm-lock.yaml"
      - "package.json"
  push:
    branches: ["main"]
    paths:
      - "packages/web/**"
      - "packages/shared-ui/**"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
      - "pnpm-lock.yaml"
      - "package.json"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static web
        run: pnpm --dir packages/web build

      - name: Audit web quality
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          runs: 1
