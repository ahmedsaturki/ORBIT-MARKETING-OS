name: CI

on:
  push:
    branches: ["main", "feat/**", "rebuild/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "10.17.1"

      - name: Workspace sanity
        run: pnpm verify:workspace

      - name: Generate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Reproducible install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Core coverage
        run: pnpm --filter @orbit/core test:coverage

      - name: Runtime smoke
        run: pnpm test:runtime

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check
