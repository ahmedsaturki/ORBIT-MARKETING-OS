name: Temporary Lockfile Regenerator

on:
  push:
    branches: ["ci/security-actions-main-20261003-v2"]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml patches
          if git diff --cached --quiet; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git commit -m "fix(deps): regenerate pnpm lockfile with pnpm 10"
          git push origin "HEAD:${GITHUB_REF_NAME}"
