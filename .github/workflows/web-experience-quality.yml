name: Web Experience Quality

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/web/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: ["main"]
    paths:
      - "packages/web/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-web-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned existing checkout
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pinned existing pnpm
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned existing setup-node
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @orbit/web build
      - name: Audit static web experience
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
