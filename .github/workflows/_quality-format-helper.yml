name: Temporary Quality Formatter

on:
  push:
    branches: ["quality/engineering-gates"]

permissions:
  contents: write

concurrency:
  group: orbit-quality-format-helper
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format target
        run: pnpm exec prettier --write scripts/node-forge-audit-exception.test.mjs

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORBIT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/node-forge-audit-exception.test.mjs
          if git diff --cached --quiet; then
            echo "Target already formatted."
            exit 0
          fi
          git commit -m "style: apply repository Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
